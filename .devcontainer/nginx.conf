worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        off;
    keepalive_timeout  60;

    resolver 127.0.0.11 valid=30s ipv6=on;

    server {
        listen 80;

        location ~* ^.*\/backend\/ {
            rewrite ^.*\/backend\/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        }

        location ~* ^.*\/browser\/ {
            rewrite ^.*\/browser\/(.*)$ /$1 break;
            proxy_pass http://browser;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600;
        }

        location ~ ^/nginx/browser_screen/(\d+)/(.*)$ {
            proxy_pass http://browser:$1/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600;

            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><base href="/nginx/browser_screen/$1/"><script>(function(){var u=new URL(window.location.href);if(!u.searchParams.get("path")){u.searchParams.set("path","nginx/browser_screen/$1/websockify");window.history.replaceState(null,"",u.toString());}})();</script>';
        }

        location = /image {
            if ($arg_url = "") {
                return 400;
            }

            if ($arg_url !~* ^https?://(([^/]+\.)?hdslb\.com|archive\.biliimg\.com)/) {
                return 403;
            }

            proxy_pass $arg_url;
            proxy_ssl_server_name on;
            proxy_set_header Host $proxy_host;
            proxy_set_header Referer https://www.bilibili.com/;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36";
            proxy_set_header Accept "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8";
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # 如果请求中不包含 /backend，转发到前端
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            # 传递原始请求头
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    upstream backend {
        server backend:23223;
    }

    upstream browser {
        server browser:3000;
    }

    upstream frontend {
        server frontend:3000;
    }
}
