services:
  frontend:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    domainname: frontend
    volumes:
      - ./session/codex:/root/.codex # You can change to C:\Users\Administrator\.codex
      - ./session/qwen:/root/.qwen
      - ./session/vercel:/.jbdevcontainer/data/com.vercel.cli
    env_file:
      - .env
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/passplease-organization/bilibili_reranger:frontend_dev}
    domainname: backend
    env_file:
      - .env
    volumes:
      - ./backend_config:/bilibili-backend/config

  nginx:
    image: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf