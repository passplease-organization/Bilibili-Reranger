services:
  frontend:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    domainname: frontend
    volumes:
      - ./session/codex:/home/vscode/.codex # You can change to C:\Users\username\.codex
      - C:/Users/Administrator/.codex/auth.json:/home/vscode/.codex/auth.json
      - ./session/codex:/root/.codex # You can change to C:\Users\username\.codex
      - C:/Users/Administrator/.codex/auth.json:/root/.codex/auth.json
      - ./session/gemini:/home/vscode/.gemini # You can change to C:\Users\username\.gemini
      - ./session/gemini:/root/.gemini # You can change to C:\Users\username\.gemini
      - ./session/codebuddy:/root/.codebuddy
      - ./session/codebuddy:/home/vscode/.codebuddy
      - ./session/claude:/root/.claude
      - ./session/claude:/home/vscode/.claude
    env_file:
      - .env
    depends_on:
      - backend
      - browser

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/passplease-organization/bilibili_reranger:frontend_dev}
    domainname: backend
    volumes:
      - ./backend_config:/bilibili-backend/config
      - ./backend_plugins:/bilibili-backend/plugins
    environment:
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: ${POSTGRES_USER:-noname}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nopassword}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_DELETE: ${POSTGRES_DELETE:-false}
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':5AB7 ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    domainname: ${POSTGRES_HOST:-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noname}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nopassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  browser:
    image: ${BROWSER_IMAGE:-ghcr.io/passplease-organization/bilibili_reranger:browser_for_dev}
    domainname: browser
    env_file:
      - .env
    environment:
      BROWSER_DEBUG_ENABLED: 1
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0BB8 ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  nginx:
    image: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      browser:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_started