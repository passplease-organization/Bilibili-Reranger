services:
  website:
    image: ${FRONTEND_IMAGE:-ghcr.io/passplease-organization/bilibili_reranger:backend_dev}
    ports:
      - '3000:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    env_file:
      - .env
    depends_on:
      - api
      - backend
      - browser

  api:
    image: noname602/bilibili_reranger_frontend_api
    domainname: api

  backend:
    build:
      dockerfile: Dockerfile
    domainname: backend
    volumes:
      - ./session/codex:/home/vscode/.codex # You can change to C:\Users\Administrator\.codex
      - ./session/qwen:/root/.qwen
    env_file:
      - .env
    environment:
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: ${POSTGRES_USER:-noname}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nopassword}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_DELETE: ${POSTGRES_DELETE:-false}
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    domainname: ${POSTGRES_HOST:-postgres}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noname}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nopassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./postgres-data:/var/lib/postgresql

  browser:
    build:
      context: ../browser
      dockerfile: dev.dockerfile
    domainname: browser
    environment:
      BM_API_PORT: 3001
      BM_VNC_PORT: 5900
      BM_NOVNC_PORT: 6080
      BM_VIEWER_PATH: /browser/vnc.html
    shm_size: '1gb'
    volumes:
      - ../browser:/crawler
    entrypoint: "npm install && npm run dev"
