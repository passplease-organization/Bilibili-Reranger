#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>

projectJDK: "21" #(Applied in CI/CD pipeline)

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
bootstrap: |+
  export VCPKG_ROOT="/opt/vcpkg"
  export PATH="$VCPKG_ROOT:$PATH"
  
  # 3.2 如果 vcpkg 不存在，则克隆并 bootstrap
  if [ ! -d "$VCPKG_ROOT" ]; then
    echo "📥 Cloning vcpkg..."
    git clone --depth=1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
    cd "$VCPKG_ROOT"
    ./bootstrap-vcpkg.sh -disableMetrics > /dev/null 2>&1
    ./vcpkg integrate install > /dev/null 2>&1
  fi
  
  # 3.3 启用 vcpkg binary caching（关键加速！）
  # 使用 Qodana 缓存目录作为 vcpkg 缓存后端
  export VCPKG_BINARY_SOURCES="clear;files,$PWD/.qodana/vcpkg-cache,readwrite"
  mkdir -p "$PWD/.qodana/vcpkg-cache"
  
  apt update && apt install -y libboost-all-dev
  apt install -y bison flex && vcpkg install libpqxx
  vcpkg install nlohmann-json
  vcpkg install cpr
  vcpkg install curl
  vcpkg install openssl
  apt update && apt install -y autoconf automake libtool pkg-config autoconf-archive
  vcpkg install libsodium
  
  if [ ! -f "build/compile_commands.json" ] && [ -f "CMakeLists.txt" ]; then
    cmake -S . -B build \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DCMAKE_BUILD_TYPE=Debug \
    -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake 2>/dev/null || true
  fi

exclude:
  - paths:
      - cmake-build-debug/**
    name: build files

  #Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
  #plugins:
  #  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

  # Quality gate. Will fail the CI/CD pipeline if any condition is not met
  # severityThresholds - configures maximum thresholds for different problem severities
  # testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
  # Code Coverage is available in Ultimate and Ultimate Plus plans
  #failureConditions:
  #  severityThresholds:
  #    any: 15
  #    critical: 5
  #  testCoverageThresholds:
  #    fresh: 70
  #    total: 50

#Qodana supports other languages, for example, Python, JavaScript, TypeScript, Go, C#, PHP
#For all supported languages see https://www.jetbrains.com/help/qodana/linters.html
linter: jetbrains/qodana-cpp:2025.3-eap