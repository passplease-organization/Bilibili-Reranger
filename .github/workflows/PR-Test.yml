name: PR-Test
on:
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
      build_temp: ${{ steps.set-image.outputs.build_temp }}
      tag: ${{ steps.set-image.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Dockerfile Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            devcontainer:
              - '.devcontainer/Dockerfile'

      - name: Select Image
        id: set-image
        run: |
          if [ "${{ steps.changes.outputs.devcontainer }}" = "true" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
            echo "image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:${TAG}" >> "$GITHUB_OUTPUT"
            echo "build_temp=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:test_container" >> "$GITHUB_OUTPUT"
            echo "build_temp=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build-temp-image:
    runs-on: ubuntu-22.04
    needs: prepare
    if: needs.prepare.outputs.build_temp == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Temp Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./.devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:${{ needs.prepare.outputs.tag }}

  Test-Code:
    runs-on: ubuntu-latest
    needs: [prepare, build-temp-image]
    if: ${{ always() && (needs.prepare.outputs.build_temp != 'true' || needs.build-temp-image.result == 'success') }}
    environment: Test
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        COOKIE: "wrong"
        USERAGENT: "wrong"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Cache
        uses: actions/cache@v4
        with:
          path: ./build
          key: backend_${{ github.workflow_ref }}

      - name: Test Code
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Test -B build
          cmake --build build
          cmake --build build --target COPY_ALL_PDBS
          cd build/Test
          chmod +x BiliBili_Reranger
          ./BiliBili_Reranger

      - uses: actions/upload-artifact@v4
        with:
          name: Test Output
          include-hidden-files: true
          path: ./build/Test/output/
          retention-days: 7
        if: always()

  cleanup-temp-image:
    runs-on: ubuntu-latest
    needs: [prepare, build-temp-image, test-code]
    if: ${{ always() && needs.prepare.outputs.build_temp == 'true' && needs.build-temp-image.result == 'success' }}
    permissions:
      packages: write
    steps:
      - name: Delete Temp Image Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="bilibili_reranger_backend"
          TAG="${{ needs.prepare.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No temp tag to delete."
            exit 0
          fi
          if versions=$(gh api -H "Accept: application/vnd.github+json" "/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100" 2>/dev/null); then
            BASE="orgs"
          else
            versions=$(gh api -H "Accept: application/vnd.github+json" "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100")
            BASE="users"
          fi
          version_id=$(echo "$versions" | jq -r --arg tag "$TAG" '.[] | select(.metadata.container.tags[]? == $tag) | .id' | head -n1)
          if [ -z "$version_id" ] || [ "$version_id" = "null" ]; then
            echo "Temp tag not found, skipping delete."
            exit 0
          fi
          gh api -X DELETE -H "Accept: application/vnd.github+json" "/$BASE/$OWNER/packages/container/$PACKAGE/versions/$version_id"

  Test-Docker:
    runs-on: ubuntu-22.04
    environment: Test
    env:
      COOKIE: ""
      USERAGENT: ""
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger:frontend_dev