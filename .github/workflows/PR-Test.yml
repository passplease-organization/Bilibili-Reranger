name: PR Tests

on:
  pull_request:

jobs:
  prepare-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      built: ${{ steps.changes.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dev container changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -E '^(Dockerfile|express/Dockerfile)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ steps.changes.outputs.build }}" = "true" ]; then
            echo "image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_frontend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_frontend:test_container" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push temporary image
        if: steps.changes.outputs.build == 'true'
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" -f Dockerfile .
          docker push "${{ steps.meta.outputs.image }}"

  test:
    needs: prepare-image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm exec vitest run

  cleanup-image:
    needs: [prepare-image, test]
    if: always() && needs.prepare-image.outputs.built == 'true'
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - name: Delete temporary image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: bilibili_reranger_frontend
          TAG: ${{ needs.prepare-image.outputs.image }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          owner = os.environ["OWNER"]
          image = os.environ["IMAGE"]
          full_tag = os.environ["TAG"]
          tag = full_tag.split(":", 1)[1] if ":" in full_tag else full_tag

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pr-test-cleanup",
          }

          def request(method, url):
            req = urllib.request.Request(url, method=method, headers=headers)
            try:
              with urllib.request.urlopen(req) as resp:
                return resp.status, resp.read().decode("utf-8")
            except urllib.error.HTTPError as err:
              return err.code, err.read().decode("utf-8")

          def list_versions(scope):
            url = f"https://api.github.com/{scope}/{owner}/packages/container/{image}/versions?per_page=100"
            status, body = request("GET", url)
            if status == 404:
              return None
            if status >= 300:
              print(body)
              sys.exit(status)
            return json.loads(body), scope

          data = list_versions("orgs") or list_versions("users")
          if not data:
            print("Package not found; skipping delete.")
            sys.exit(0)
          versions, scope = data

          version_id = None
          for version in versions:
            tags = version.get("metadata", {}).get("container", {}).get("tags", [])
            if tag in tags:
              version_id = version["id"]
              break

          if not version_id:
            print("No matching tag found; skipping delete.")
            sys.exit(0)

          del_url = f"https://api.github.com/{scope}/{owner}/packages/container/{image}/versions/{version_id}"
          status, body = request("DELETE", del_url)
          if status >= 300:
            print(body)
            sys.exit(status)
          print(f"Deleted image tag: {tag}")
          PY
