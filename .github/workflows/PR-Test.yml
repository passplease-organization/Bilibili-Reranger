name: PR-Test
on:
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.select-images.outputs.backend_image }}
      backend_build_temp: ${{ steps.select-images.outputs.backend_build_temp }}
      backend_tag: ${{ steps.select-images.outputs.backend_tag }}
      browser_image: ${{ steps.select-images.outputs.browser_image }}
      browser_build_temp: ${{ steps.select-images.outputs.browser_build_temp }}
      browser_tag: ${{ steps.select-images.outputs.browser_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Detect Dockerfile Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'Dockerfile'
              - '.devcontainer/Dockerfile'
              - '.github/workflows/backend-docker.yml'
            browser:
              - 'browser/Dockerfile'
              - 'browser/dev.dockerfile'
              - '.github/workflows/browser-docker.yml'

      - name: Select Images
        id: select-images
        run: |
          if [ "${{ steps.changes.outputs.backend }}" = "true" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
            BACKEND_TAG="pr-${{ github.event.pull_request.number }}-backend-${{ github.sha }}"
            echo "backend_image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
            echo "backend_build_temp=true" >> "$GITHUB_OUTPUT"
            echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "backend_image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:test_container" >> "$GITHUB_OUTPUT"
            echo "backend_build_temp=false" >> "$GITHUB_OUTPUT"
            echo "backend_tag=" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.changes.outputs.browser }}" = "true" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
            BROWSER_TAG="pr-${{ github.event.pull_request.number }}-browser-${{ github.sha }}"
            echo "browser_image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_browser:${BROWSER_TAG}" >> "$GITHUB_OUTPUT"
            echo "browser_build_temp=true" >> "$GITHUB_OUTPUT"
            echo "browser_tag=${BROWSER_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "browser_image=ghcr.io/${{ github.repository_owner }}/bilibili_reranger_browser:test_container" >> "$GITHUB_OUTPUT"
            echo "browser_build_temp=false" >> "$GITHUB_OUTPUT"
            echo "browser_tag=" >> "$GITHUB_OUTPUT"
          fi

  build-temp-backend-image:
    runs-on: ubuntu-22.04
    needs: prepare
    if: needs.prepare.outputs.backend_build_temp == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Temp Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./.devcontainer/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.backend_image }}

  build-temp-browser-image:
    runs-on: ubuntu-22.04
    needs: prepare
    if: needs.prepare.outputs.browser_build_temp == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Temp Browser Image
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          file: ./browser/dev.dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.browser_image }}

  test-code-backend:
    runs-on: ubuntu-latest
    needs: [prepare, build-temp-backend-image]
    if: ${{ always() && (needs.prepare.outputs.backend_build_temp != 'true' || needs.build-temp-backend-image.result == 'success') }}
    environment: Test
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare.outputs.backend_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        COOKIE: "wrong"
        USERAGENT: "wrong"
        DB_HOST: "postgres"
        DB_PORT: "5432"
        DB_NAME: "bilibili_test"
        DB_USER: "bilibili"
        DB_PASSWORD: "bilibili"
        ALL_CONTAINER_ONLINE: "0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilibili_test
          POSTGRES_USER: bilibili
          POSTGRES_PASSWORD: bilibili
        options: >-
          --health-cmd "pg_isready -U bilibili -d bilibili_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Cache
        uses: actions/cache@v4
        with:
          path: ./build
          key: backend_${{ github.workflow_ref }}

      - name: Test Backend Code
        run: |
          cmake --preset test
          cmake --build --preset test
          cmake --build --preset test --target COPY_ALL_PDBS
          cd build/test/Test
          chmod +x BiliBili_Reranger
          ./BiliBili_Reranger

      - name: Upload Backend Test Output
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          include-hidden-files: true
          path: ./build/test/Test/output/
          retention-days: 7
        if: always()

  test-code-browser:
    runs-on: ubuntu-latest
    needs: [prepare, build-temp-browser-image]
    if: ${{ always() && (needs.prepare.outputs.browser_build_temp != 'true' || needs.build-temp-browser-image.result == 'success') }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare.outputs.browser_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: browser

      - name: Install Dependencies
        run: cd browser && npm ci

      - name: Test Browser Code
        run: cd browser && npm run test

  test-integration:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-temp-backend-image
      - build-temp-browser-image
      - test-code-backend
      - test-code-browser
    if: >-
      ${{
        always() &&
        needs.test-code-backend.result == 'success' &&
        needs.test-code-browser.result == 'success' &&
        (needs.prepare.outputs.backend_build_temp != 'true' || needs.build-temp-backend-image.result == 'success') &&
        (needs.prepare.outputs.browser_build_temp != 'true' || needs.build-temp-browser-image.result == 'success')
      }}
    environment: Test
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare.outputs.backend_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        COOKIE: "wrong"
        USERAGENT: "wrong"
        DB_HOST: "postgres"
        DB_PORT: "5432"
        DB_NAME: "bilibili_test"
        DB_USER: "bilibili"
        DB_PASSWORD: "bilibili"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilibili_test
          POSTGRES_USER: bilibili
          POSTGRES_PASSWORD: bilibili
        options: >-
          --health-cmd "pg_isready -U bilibili -d bilibili_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      browser:
        image: ${{ needs.prepare.outputs.browser_image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Cache
        uses: actions/cache@v4
        with:
          path: ./build
          key: backend_${{ github.workflow_ref }}

      - name: Wait for Browser Service
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://browser:3000/ >/dev/null 2>&1; then
              echo "Browser service is ready."
              exit 0
            fi
            echo "Waiting for browser service..."
            sleep 5
          done
          echo "Browser service did not become ready in time."
          exit 1

      - name: Test Backend With Browser Service
        run: |
          cmake --preset test
          cmake --build --preset test
          cmake --build --preset test --target COPY_ALL_PDBS
          cd build/test/Test
          chmod +x BiliBili_Reranger
          ./BiliBili_Reranger

      - name: Upload Integration Test Output
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          include-hidden-files: true
          path: ./build/test/Test/output/
          retention-days: 7
        if: always()

  cleanup-temp-images:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-temp-backend-image
      - build-temp-browser-image
      - test-code-backend
      - test-code-browser
      - test-integration
    if: >-
      ${{
        always() &&
        (
          (needs.prepare.outputs.backend_build_temp == 'true' && needs.build-temp-backend-image.result == 'success') ||
          (needs.prepare.outputs.browser_build_temp == 'true' && needs.build-temp-browser-image.result == 'success')
        )
      }}
    permissions:
      packages: write
    steps:
      - name: Delete Temp Image Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          BACKEND_TAG: ${{ needs.prepare.outputs.backend_tag }}
          BROWSER_TAG: ${{ needs.prepare.outputs.browser_tag }}
        run: |
          delete_tag() {
            PACKAGE="$1"
            TAG="$2"

            if [ -z "$TAG" ]; then
              echo "No temp tag for $PACKAGE, skipping."
              return 0
            fi

            if versions=$(gh api -H "Accept: application/vnd.github+json" "/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100" 2>/dev/null); then
              BASE="orgs"
            else
              versions=$(gh api -H "Accept: application/vnd.github+json" "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100")
              BASE="users"
            fi

            version_id=$(echo "$versions" | jq -r --arg tag "$TAG" '.[] | select(.metadata.container.tags[]? == $tag) | .id' | head -n1)
            if [ -z "$version_id" ] || [ "$version_id" = "null" ]; then
              echo "Temp tag $TAG for $PACKAGE not found, skipping."
              return 0
            fi

            gh api -X DELETE -H "Accept: application/vnd.github+json" "/$BASE/$OWNER/packages/container/$PACKAGE/versions/$version_id"
            echo "Deleted $PACKAGE:$TAG"
          }

          delete_tag "bilibili_reranger_backend" "$BACKEND_TAG"
          delete_tag "bilibili_reranger_browser" "$BROWSER_TAG"
