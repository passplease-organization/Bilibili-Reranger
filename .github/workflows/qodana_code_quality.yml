#-------------------------------------------------------------------------------#
#            Discover all capabilities of Qodana in our documentation           #
#             https://www.jetbrains.com/help/qodana/about-qodana.html           #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - backend

jobs:
  backend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:test_container
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment: Test
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_BACKEND }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          args: '--linter qodana-cpp'
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'
  browser:
    runs-on: ubuntu-latest
    container:
      # 镜像地址完全动态生成，确保拉取的是当前 commit 构建的镜像
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_browser:test_container
      # 使用 GITHUB_TOKEN 来拉取私有或内部镜像
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment: Test
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_BROWSER }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: '0'
          sparse-checkout:
            'browser'

      - run: |
          cd browser
          npm install

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          args: '--linter qodana-js --only-directory browser'
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'