name: Release Backend
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Backend ref to build the SDK from.
        required: false
        default: backend
      release_tag:
        description: Optional release tag to upload SDK archives to.
        required: false
        default: ""
      push_sdk_image:
        description: Push the plugin development image.
        required: false
        type: boolean
        default: true
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: release-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_sdk:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      push_image: ${{ steps.resolve.outputs.push_image }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve SDK Inputs
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUSH_IMAGE: ${{ inputs.push_sdk_image }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/bilibili_reranger:plugin_dev
        run: |
          REF="${INPUT_REF:-backend}"
          RELEASE_TAG="${INPUT_RELEASE_TAG:-}"
          PUSH_IMAGE="${INPUT_PUSH_IMAGE:-true}"

          if [ -z "${RELEASE_TAG}" ] && [ -n "${RELEASE_EVENT_TAG}" ]; then
            RELEASE_TAG="${RELEASE_EVENT_TAG}"
          fi

          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_image=${PUSH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image=${SDK_IMAGE}" >> "$GITHUB_OUTPUT"

  Create-Image:
    needs: prepare_sdk
    if: needs.prepare_sdk.outputs.release_tag != ''
    strategy:
      matrix:
        image: [backend, frontend]
    runs-on: ubuntu-22.04
    environment: Publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.image }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: noname602
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger_${{ matrix.image }}:${{ needs.prepare_sdk.outputs.release_tag }}
            docker.io/noname602/bilibili_reranger_${{ matrix.image }}:${{ needs.prepare_sdk.outputs.release_tag }}
            docker.io/noname602/bilibili_reranger_${{ matrix.image }}:latest

      - name: Build and push Docker image for browser
        uses: docker/build-push-action@v5
        with:
          file: ./browser/Dockerfile
          context: ./browser
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger_browser:${{ needs.prepare_sdk.outputs.release_tag }}
            docker.io/noname602/bilibili_reranger_browser:${{ needs.prepare_sdk.outputs.release_tag }}
            docker.io/noname602/bilibili_reranger_browser:latest
        if: matrix.image == 'backend'

  publish_sdk:
    runs-on: ubuntu-22.04
    needs: prepare_sdk
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_sdk.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: needs.prepare_sdk.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export SDK Archives From Docker Build
        run: |
          docker buildx build \
            --file sdk.dockerfile \
            --target sdk-artifacts \
            --cache-from type=gha,scope=bilibili-reranger-plugin-sdk \
            --cache-to type=gha,scope=bilibili-reranger-plugin-sdk,mode=max \
            --output type=local,dest=sdk-output \
            .

      - name: Pack SDK Archives
        run: |
          mkdir -p sdk-artifacts
          tar -C sdk-output/bilibili-reranger-sdk -czf sdk-artifacts/bilibili-reranger-sdk-debug.tar.gz debug
          tar -C sdk-output/bilibili-reranger-sdk -czf sdk-artifacts/bilibili-reranger-sdk-release.tar.gz release
          tar -C sdk-output -czf sdk-artifacts/bilibili-reranger-sdk-all.tar.gz bilibili-reranger-sdk

      - name: Upload SDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-reranger-plugin-sdk
          path: sdk-artifacts/*.tar.gz
          retention-days: 30

      - name: Upload SDK Archives To Release
        if: needs.prepare_sdk.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare_sdk.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" sdk-artifacts/*.tar.gz --clobber

      - name: Build and Push Plugin Development Image
        if: needs.prepare_sdk.outputs.push_image == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: sdk.dockerfile
          target: plugin-dev
          push: true
          cache-from: type=gha,scope=bilibili-reranger-plugin-sdk
          cache-to: type=gha,scope=bilibili-reranger-plugin-sdk,mode=max
          tags: |
            ${{ needs.prepare_sdk.outputs.image }}
