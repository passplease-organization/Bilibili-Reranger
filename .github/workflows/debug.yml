name: debug.yml
on:
  workflow_dispatch:
  push:
    branches:
      - backend
    paths-ignore:
      - .devcontainer/Dockerfile
      - .github/workflows/docker.yml
      - .github/workflows/PR-Test.yml

jobs:
  Test-Code:
    runs-on: ubuntu-latest
    environment: Test
    container:
      # 镜像地址完全动态生成，确保拉取的是当前 commit 构建的镜像
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:test_container
      # 使用 GITHUB_TOKEN 来拉取私有或内部镜像
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        COOKIE: ${{ secrets.COOKIE }}
        USERAGENT: ${{ secrets.USERAGENT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Cache
        uses: actions/cache@v4
        with:
          path: ./build
          key: backend_${{ github.workflow_ref }}

      - name: Test Code
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Test -B build
          cmake --build build
          cmake --build build --target COPY_ALL_PDBS
          cd build/Test
          chmod +x BiliBili_Reranger
          ./BiliBili_Reranger

      - uses: actions/upload-artifact@v4
        with:
          name: Test Output
          include-hidden-files: true
          path: ./build/Test/output/
          retention-days: 7
        if: always()

  Test-Docker:
    runs-on: ubuntu-22.04
    needs: Test-Code
    environment: Test
    env:
      COOKIE: ${{ secrets.COOKIE }}
      USERAGENT: ${{ secrets.USERAGENT }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger:frontend_dev

      - name: Run Image
        run: |
          docker run --name run-test -e COOKIE -e USERAGENT -d ghcr.io/${{ github.repository_owner }}/bilibili_reranger:frontend_dev
          sleep 10
          docker stop run-test
        continue-on-error: true