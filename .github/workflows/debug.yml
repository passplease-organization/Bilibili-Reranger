name: Debug All
on:
  workflow_dispatch:
  push:
    branches:
      - backend
    paths-ignore:
      - .devcontainer/Dockerfile
      - backend-docker.yml
      - .github/workflows/PR-Test.yml
      - README.md
      - README_en.md
      - LICENSE
      - .github/workflows/qodana_code_quality.yml
      - browser/qodana.yaml

jobs:
  Test-Code-Backend:
    runs-on: ubuntu-latest
    environment: Test
    container:
      # 镜像地址完全动态生成，确保拉取的是当前 commit 构建的镜像
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_backend:test_container
      # 使用 GITHUB_TOKEN 来拉取私有或内部镜像
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        COOKIE: ${{ secrets.COOKIE }}
        USERAGENT: ${{ secrets.USERAGENT }}
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: bilibili_test
        DB_USER: bilibili
        DB_PASSWORD: bilibili
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilibili_test
          POSTGRES_USER: bilibili
          POSTGRES_PASSWORD: bilibili
        options: >-
          --health-cmd "pg_isready -U bilibili -d bilibili_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Cache
        uses: actions/cache@v4
        with:
          path: ./build
          key: backend_${{ github.workflow_ref }}

      - name: Test Code
        run: |
          cmake --preset test
          cmake --build --preset test
          cmake --build --preset test --target COPY_ALL_PDBS
          cd build/test/Test
          chmod +x BiliBili_Reranger
          ./BiliBili_Reranger

      - uses: actions/upload-artifact@v6
        with:
          name: Test Output
          include-hidden-files: true
          path: ./build/test/Test/output/
          retention-days: 7
        if: always()

  Test-Docker-Backend:
    runs-on: ubuntu-22.04
    needs: Test-Code-Backend
    environment: Test
    env:
      COOKIE: ${{ secrets.COOKIE }}
      USERAGENT: ${{ secrets.USERAGENT }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger:frontend_dev

      - name: Run Image
        run: |
          docker run --name run-test -e COOKIE -e USERAGENT -d ghcr.io/${{ github.repository_owner }}/bilibili_reranger:frontend_dev
          sleep 10
          docker stop run-test
        continue-on-error: true

  Test-Code-Browser:
    runs-on: ubuntu-latest
    container:
      # 镜像地址完全动态生成，确保拉取的是当前 commit 构建的镜像
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_browser:test_container
      # 使用 GITHUB_TOKEN 来拉取私有或内部镜像
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: browser

      - name: Install Dependencies
        run: cd browser && npm install

      - name: Run Test
        run: cd browser && npm run test

  Test-Docker-Browser:
    runs-on: ubuntu-22.04
    needs: Test-Code-Browser
    environment: Test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: browser

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger:browser_for_dev

      - name: Run Image
        run: |
          docker run --name run-test -e COOKIE -e USERAGENT -d ghcr.io/${{ github.repository_owner }}/bilibili_reranger:browser_for_dev
          sleep 10
          docker stop run-test
        continue-on-error: true
