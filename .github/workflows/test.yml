name: Test Website
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - .devcontainer/Dockerfile
      - .github/workflows/docker.yml

jobs:
  Build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_frontend:test_container
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build:vercel
          npm run build:docker