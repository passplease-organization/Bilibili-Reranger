name: Test Website
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - .devcontainer/Dockerfile
      - .github/workflows/docker.yml

jobs:
  Build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/bilibili_reranger_frontend:test_container
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  Build-Docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    needs: Build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: frontend

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bilibili_reranger:backend_dev