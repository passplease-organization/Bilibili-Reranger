services:
  website:
    build:
      dockerfile: Dockerfile
      context: ../
    ports:
      - '300:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - backend

  api:
    build:
      dockerfile: express/Dockerfile
      context: ../
    domainname: api

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/passplease-organization/bilibili_reranger:frontend_dev}
    domainname: backend
    env_file:
      - ../.devcontainer/env.list
    volumes:
      - ./backend_config:/bilibili-backend/config